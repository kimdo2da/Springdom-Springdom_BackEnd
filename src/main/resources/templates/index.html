<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>세이프라이트 CCTV 지도</title>

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b0cb55172bf6c4a1115788c58a8a0021&libraries=clusterer"></script>

    <style>
        body, html { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
        #loading {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: white; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; z-index: 999; display: none;
        }
    </style>
</head>

<body>

<div id="map"></div>
<div id="loading">🚀 수만 개의 CCTV 데이터를 부드럽게 그리는 중...</div>

<script>
    window.onload = function () {
        var container = document.getElementById('map');
        var map = new kakao.maps.Map(container, {
            center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울 중심
            level: 8 // 수만 개를 한눈에 보기 좋게 넓은 레벨 적용
        });

        // ⚡ 클러스터러 최적화 옵션 적용 (격자 크기를 80으로 늘림)
        var clusterer = new kakao.maps.MarkerClusterer({
            map: map,
            averageCenter: true,
            minLevel: 6,
            gridSize: 80,
            disableClickZoom: false
        });

        document.getElementById('loading').style.display = 'block';

        // 백엔드 데이터 요청
        fetch("http://localhost:8080/cctvs")
            .then(res => res.json())
            .then(response => {
                var cctvList = response.data;
                console.log("🔥 불러온 CCTV 개수:", cctvList.length);

                // ⚡ 브라우저 멈춤 방지를 위한 분할(Chunk) 처리
                var chunkSize = 5000;
                var currentIndex = 0;

                function renderChunk() {
                    var chunkMarkers = [];
                    var end = Math.min(currentIndex + chunkSize, cctvList.length);

                    for (var i = currentIndex; i < end; i++) {
                        var pos = new kakao.maps.LatLng(
                            parseFloat(cctvList[i].latitude),
                            parseFloat(cctvList[i].longitude)
                        );
                        chunkMarkers.push(new kakao.maps.Marker({ position: pos }));
                    }

                    // 쪼개진 마커들을 먼저 지도에 올림
                    clusterer.addMarkers(chunkMarkers);
                    currentIndex = end;

                    if (currentIndex < cctvList.length) {
                        // 남은 데이터가 있으면 0.01초 쉬고 다시 그리기 (멈춤 방지)
                        setTimeout(renderChunk, 10);
                    } else {
                        // 모든 렌더링 종료
                        document.getElementById('loading').style.display = 'none';
                        console.log("✅ 렌더링 완벽 종료!");
                    }
                }

                // 렌더링 시작!
                renderChunk();
            })
            .catch(err => {
                console.error("fetch 실패:", err);
                document.getElementById('loading').innerText = "❌ 데이터를 불러오는데 실패했습니다.";
            });
    };
</script>

</body>
</html>
