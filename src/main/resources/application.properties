# ==================================================================
# 7. 공공데이터 수집
#
# 예전에는 자치구별 CSV 를 저장소에 넣어 두고 서버가 뜰 때 읽었습니다.
# 이제는 아래 출처에서 전국 데이터를 직접 받아 DB 에 저장합니다.
# 공공데이터가 월 1회 갱신되고 호출 한도도 있어서 매월 5일에만 다시 받습니다.
# ==================================================================

# 매월 5일 새벽 3시 (초 분 시 일 월 요일)
publicdata.sync-cron=0 0 3 5 * *

# 표가 비어 있으면 서버 기동 후 1회 자동 수집. 처음 채울 때만 true 로 쓰세요.
publicdata.sync-on-empty-startup=false

# --- 전국보안등표준데이터 (오픈 API, 약 184만 건) ---
publicdata.security-light.endpoint=https://api.data.go.kr/openapi/tn_pubr_public_scrty_lmp_api
# 공공데이터포털 일반 인증키(URL 인코딩된 값 그대로 붙여 넣습니다)
publicdata.security-light.service-key=Z2rvg6GG%2BEU8KqPacBm8BAmu9%2FhBjjTi4vxGKl%2FBEccQgD5jThqZF9ZNUiOcfNZoneIQRKW2%2BX%2F%2FIvKj3f4Acg%3D%3D
# 포털 상한이 1000 입니다. 그보다 크게 요청하면 빈 응답이 옵니다.
publicdata.security-light.page-size=1000
publicdata.security-light.max-retry=3
publicdata.security-light.request-interval-millis=50

# --- 전국CCTV표준데이터 (배포 파일 CSV, 약 37만 행) ---
# 이 데이터셋은 오픈 API 가 아니라 파일로 배포됩니다. 인증키가 필요 없습니다.
publicdata.cctv.mode=file
publicdata.cctv.file-url=https://file.localdata.go.kr/file/download/cctv_info/info
publicdata.cctv.file-charset=MS949
publicdata.cctv.download-timeout-millis=300000
# 공공데이터포털에서 '전국CCTV표준데이터' 활용신청이 승인되면
# mode 를 api 로 바꾸고 아래 인증키만 채우면 됩니다.
publicdata.cctv.endpoint=https://api.data.go.kr/openapi/tn_pubr_public_cctv_api
publicdata.cctv.service-key=Z2rvg6GG%2BEU8KqPacBm8BAmu9%2FhBjjTi4vxGKl%2FBEccQgD5jThqZF9ZNUiOcfNZoneIQRKW2%2BX%2F%2FIvKj3f4Acg%3D%3D
publicdata.cctv.page-size=1000

# --- 좌표 없는 보안등 주소 → 좌표 변환 ---
# 전국 보안등의 약 9%(12만~18만 개 주소)는 위·경도 칸이 비어 있고 주소만 있습니다.
# 서울에서는 강남·용산·마포·송파가 통째로 여기 해당합니다.
#
# 카카오 로컬 API 는 하루 10만 건까지입니다. 주소 하나가 최대 2건(주소검색 실패 시 키워드검색)을
# 쓰므로 2000개씩 1시간마다 = 하루 4.8만~9.6만 건으로 한도 안에 둡니다.
# 다 채우는 데 사흘쯤 걸리지만 결과를 geocode_cache 에 남기므로 한 번만 치르면 됩니다.
publicdata.geocoding.enabled=true
publicdata.geocoding.max-addresses-per-run=2000
publicdata.geocoding.request-interval-millis=30
# 남은 주소를 이어서 처리하는 주기(ms).
# 끄려면 이 값이 아니라 위의 enabled=false 를 쓰세요 — 0 을 넣으면 서버가 뜨지 않습니다.
publicdata.geocoding.drain-interval-millis=3600000
