<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>세이프라이트.CCTV 지도</title>

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=***********카카오api**********"></script>

    <style>
        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>

    window.onload = function () {

        var container = document.getElementById('map');

        var map = new kakao.maps.Map(container, {
            center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울 중심
            level: 7
        });

        // 클러스터러 생성
        var clusterer = new kakao.maps.MarkerClusterer({
            map: map,
            averageCenter: true,
            minLevel: 6,   // 줌 아웃 시 자동 클러스터
            disableClickZoom: false
        });

        // 🔥 2. 스프링 부트 서버로 CCTV 데이터 요청 (명세서 규칙 /cctvs 적용)
        fetch("http://localhost:8080/cctvs")
            .then(res => res.json())
            .then(response => {

                // 🔥 3. 공통 응답 구조 {success, data, message}에서 data 배열 추출
                var cctvList = response.data;
                console.log("CCTV 개수:", cctvList.length);

                var markers = [];

                for (var i = 0; i < cctvList.length; i++) {

                    // 🔥 4. 명세서에 약속된 변수명 latitude, longitude 적용
                    var pos = new kakao.maps.LatLng(
                        parseFloat(cctvList[i].latitude),
                        parseFloat(cctvList[i].longitude)
                    );

                    var marker = new kakao.maps.Marker({
                        position: pos
                    });

                    markers.push(marker);
                }

                // 한 번에 클러스터에 추가 (성능 핵심)
                clusterer.addMarkers(markers);

            })
            .catch(err => {
                console.error("fetch 실패:", err);
            });

    };

</script>

</body>
</html>
