<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>세이프라이트.CCTV 지도</title>

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=***************카카오api키자리입니다."></script>

    <style>
        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script>

    window.onload = function () {

        var container = document.getElementById('map');

        var map = new kakao.maps.Map(container, {
            center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울 중심
            level: 7
        });

        // 🔥 1. 클러스터러 생성 (핵심)
        var clusterer = new kakao.maps.MarkerClusterer({
            map: map,
            averageCenter: true,
            minLevel: 6,   // 줌 아웃 시 자동 클러스터
            disableClickZoom: false
        });

        // 스프링 부트 서버로 CCTV 데이터 요청
        fetch("http://localhost:8080/cctv")
            .then(res => res.json())
            .then(data => {

                console.log("CCTV 개수:", data.length);

                var markers = [];

                for (var i = 0; i < data.length; i++) {

                    var pos = new kakao.maps.LatLng(
                        parseFloat(data[i].lat),
                        parseFloat(data[i].lng)
                    );

                    var marker = new kakao.maps.Marker({
                        position: pos
                        // ❌ map에 직접 넣으면 안 됨
                    });

                    markers.push(marker);
                }

                // 🔥 2. 한 번에 클러스터에 추가 (성능 핵심)
                clusterer.addMarkers(markers);

            })
            .catch(err => {
                console.error("fetch 실패:", err);
            });

    };

</script>

</body>
</html>
